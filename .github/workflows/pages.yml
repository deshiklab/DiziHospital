name: pages

# The documentation preview: this repository's own documents — the operator handbook,
# catalogue, plan, research, migration notes and the mirrored help library — assembled
# into a static site and published to GitHub Pages on every push that changes them.
#
# What it publishes and what it does not: it builds `docs/` only. No part of `apps/web`
# is built here, nothing calls `services/api`, and there is no database — so a green
# deployment is evidence that the documentation renders, never that the product runs.
# The help library is a mirror of the vendor's public help centre and is marked as such
# on the page that indexes it; the clean-room rule still governs `apps/`, `services/`
# and `packages/`, which this job never reads.
#
# The site is generated into `docs/build/site/`, which is ignored by git: the artifact is
# the deployment, so half a hundred megabytes of HTML never enters the history.

on:
  push:
    branches: [ arena/ac321db7-dizihospital, main ]
    paths:
      - 'docs/**'
      - 'tools/docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing a site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the renderer
        run: pip install --quiet markdown

      - name: Render the guide (the printable single page the PDF is made from)
        run: python3 tools/docs/build_html.py

      - name: Assemble the site, and fail if any link inside it does not resolve
        run: python3 tools/docs/build_site.py

      # The rendered site is also uploaded as an ordinary artifact, *before* the Pages check, so that a repository
      # whose owner has not switched Pages on yet still gets the thing this job built: Actions → this run → download
      # `documentation-site.zip`, open `index.html`. A deployment that cannot happen should still hand over its work.
      - name: Upload the site as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: docs/build/site
          retention-days: 30

      # `enablement: true` asks Actions to turn Pages on if the repository is permitted to. It is positioned before
      # the explicit check so a first-time setup does not fail the workflow before the repo is switched on.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Pages may still be unavailable if the repository is not permitted to enable it programmatically. In that case
      # we warn instead of aborting the build, but the deployment step below will still surface the real status.
      - name: Verify Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" != "200" ]; then
            echo "::warning::Pages is not enabled for $GITHUB_REPOSITORY (the API answered $code). A repository administrator opens Settings → Pages once and sets Source to 'GitHub Actions'; after that this workflow publishes on every change under docs/."
            exit 0
          fi
          echo "Pages is enabled: $(python3 -c "import json;print(json.load(open('/tmp/pages.json')).get('html_url'))")"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/site

      - name: What was published
        run: |
          du -sh docs/build/site
          echo "pages: $(find docs/build/site -name '*.html' | wc -l) html file(s)" >> "$GITHUB_STEP_SUMMARY"
          echo "size: $(du -sh docs/build/site | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
