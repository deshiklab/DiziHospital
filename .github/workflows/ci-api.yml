name: ci-api

# The API service's own job, and the only place in this repository where PHP and Composer can run.
#
# That is not an oversight in the development environment; it is the environment. Packagist is reachable from GitHub
# Actions and nowhere else, so the service is written against PHP 8.4 and proved here rather than on somebody's
# laptop. `services/api/README.md` states the same limitation, and tools/ci/php-lint.mjs is what keeps a syntax error
# from costing a CI round trip: it parses every file with PHP compiled to WebAssembly.
on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'services/**'
      - 'packages/contracts/**'
      - 'tools/ci/php-lint.mjs'
      - '.github/workflows/ci-api.yml'
  pull_request:
    paths:
      - 'services/**'
      - 'packages/contracts/**'
      - 'tools/ci/php-lint.mjs'
      - '.github/workflows/ci-api.yml'

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: php 8.4, style, contract and rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Write access for exactly one step: committing the lock file, while there is not one. It comes off again in the
    # commit after that lands, and until then no other step pushes anything.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      # php 8.4 because that is what composer.json pins, and the extensions are the ones this service actually
      # uses: mbstring for the Bangla name comparison and the length checks, the SQLite pair for the test suite,
      # and the Postgres pair because the production database is Postgres and a driver that is missing from the
      # image must be a setup failure here rather than a 500 on a ward.
      - name: PHP 8.4 with the extensions this service uses
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pgsql, pdo_pgsql, openssl, tokenizer, dom, xml, curl
          tools: composer:v2
          coverage: none

      # No composer.lock is committed yet, and it cannot be resolved outside Actions: packagist is reachable only
      # from this runner. Composer resolves the versions on the first install and writes the lock, which the step
      # below commits — so the job is reproducible from the second run onwards rather than from the first.
      - name: Install the service's dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # `composer.lock` cannot be produced outside Actions — composer needs packagist, which only this runner can
      # reach — so the runner that resolved it commits it: once, while the file is untracked, touching nothing but that
      # file. After the lock has landed this is a no-op for every later run, which is what makes it a bootstrap rather
      # than a bot. Only on a push, because on a pull request the checkout is the merge commit and appending to it
      # would put a branch nobody asked for in the history.
      - name: Commit the resolved versions, once
        if: github.event_name == 'push'
        run: |
          # Asked of git rather than of the working tree: `composer install` above has just written the file, so a
          # check for its absence here would always be false and the step would never run.
          if git ls-files --error-unmatch composer.lock > /dev/null 2>&1; then
            echo 'composer.lock is committed already — nothing to do.'
            exit 0
          fi
          git config user.name 'ci-api'
          git config user.email 'ci-api@users.noreply.github.com'
          git add composer.lock
          git commit -m 'chore(api): the resolved versions, as composer resolved them'
          git push origin "HEAD:${{ github.ref_name }}"

      # Every file, one at a time, before anything heavier: a parse error reported by name is a minute; the same
      # parse error found by PHPUnit is a stack trace about an autoloader.
      - name: Every PHP file parses
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Pint — the style rules this repository pins
        run: |
          set +e
          vendor/bin/pint --test -v > /tmp/pint.log 2>&1
          status=$?
          cat /tmp/pint.log
          if [ "$status" -ne 0 ]; then
            # Two annotations: the files and rules at the end of the report, and the beginning of the first diff. A
            # check run's annotations are the part of a failure that can be read from outside the log.
            echo "::error ::$(tail -30 /tmp/pint.log | head -c 5000 | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')"
            echo "::error ::$(head -c 3000 /tmp/pint.log | sed 's/%/%25/g' | sed -z 's/\n/%0A/g')"
          fi
          exit "$status"

      # The suite runs against SQLite in memory, which needs no service container, and the assertions the product
      # cares about are about rules rather than about the engine: which numbers a node may mint, what a stale version
      # does, what a replayed key does, and whether an altered ledger entry can be found. The Postgres-specific half —
      # the module schemas and the row locks — is the second job below, because SQLite cannot prove it.
      # The failure list is echoed as an annotation rather than left in the log alone: a check run's annotations are
      # what a contributor — or an agent working in a sandbox that cannot download Actions logs — can read back.
      - name: The contract, the rules and the ledger
        run: |
          set +e
          vendor/bin/phpunit --display-warnings 2>&1 | tee /tmp/phpunit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The failure names, the assertion sentences and this service's own messages — one line each, as one
            # annotation. A check run's annotations are limited and its diffs are not worth the room: what is needed
            # from outside the log is which test failed and what it expected.
            sed -n '/^There w/,$p' /tmp/phpunit.log \
              | grep -vE '^(\s|[-+]|\$)' \
              | head -50 | sed 's/%/%25/g' | sed -z 's/\n/%0A/g' | sed 's/^/::error ::/'
          fi
          exit "$status"

      - name: Server log on failure
        if: failure()
        run: ls -la storage/logs && tail -100 storage/logs/*.log || true

  # `ModuleSchema` creates one Postgres schema per module, so on Postgres the tests' `registration_patients` is
  # `registration.patients`. That difference is exactly the part of the production DDL SQLite cannot check, and it is
  # the part that would fail on the first deployment of the first module. This job migrates a real Postgres 18 from
  # empty and then from scratch again.
  schema:
    name: the module schemas migrate on postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dizihospital
          POSTGRES_USER: dizi
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: dizihospital
      DB_USERNAME: dizi
      DB_PASSWORD: secret
      NODE_SECRET: ci-node-secret
      AUTH_PREVIEW_SECRET: ci-auth-secret
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.4 with the extensions this service uses
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pgsql, pdo_pgsql, pdo_sqlite, sqlite3, openssl, tokenizer, dom, xml, curl
          tools: composer:v2
          coverage: none

      - name: Install the service's dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Migrate an empty Postgres
        run: |
          set +e
          output=$(php artisan migrate --force 2>&1)
          status=$?
          printf '%s\n' "$output"
          printf '%s\n' "$output" | head -10 | sed 's/^/::error ::/'
          exit "$status"

      - name: Every implemented module has its schema and its tables
        run: php artisan dizi:modules --check

      # `migrate:refresh`, not `migrate:fresh`: fresh wipes the schema Laravel knows about (public) and would leave
      # `registration`, `sync` and `audit` standing, so the second migrate would fail on a table that already exists.
      # Refresh walks every migration's `down()`, which drops the module schemas — so this step proves the rollback
      # path as well as the migrate path, and the README says the same thing for anybody doing it by hand.
      - name: Migrate back down and up again
        run: php artisan migrate:refresh --force

      - name: ... and the modules are there after the round trip
        run: php artisan dizi:modules --check
