name: capture-recon
on:
  push:
    branches: [ arena/ac321db7-dizihospital ]
    paths-ignore:
      - 'capture/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: capture-recon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install playwright
        working-directory: tools/capture
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run recon
        working-directory: tools/capture
        env:
          SH_BASE: https://demo.smart-hospital.in
          SH_USER: superadmin@gmail.com
          SH_PASS: password
          OUT_DIR: ../../capture/recon
        run: node recon.js

      - name: Commit results
        run: |
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add -A capture
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -q -m "chore(capture): recon output [skip ci]"
            git push
          fi
