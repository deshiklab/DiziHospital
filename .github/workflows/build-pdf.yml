name: build-pdf
on:
  push:
    branches: [ arena/ac321db7-dizihospital ]
    paths:
      - 'docs/**'
      - 'tools/docs/**'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

concurrency:
  group: docs-pdf
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install playwright + python markdown
        run: |
          pip3 install --quiet markdown pillow pypdf || pip3 install --quiet --break-system-packages markdown pillow pypdf
          cd tools/capture && npm install --no-audit --no-fund >/dev/null 2>&1
          cd ../.. && npm install playwright --no-audit --no-fund >/dev/null 2>&1 || true
          npx playwright install chromium >/dev/null 2>&1

      - name: Rebuild catalogue from capture evidence
        run: python3 tools/docs/build_docs.py

      - name: Build help library index
        run: python3 tools/docs/build_help_library.py || echo "no help library mirror yet"

      - name: Render print-ready HTML
        run: |
          mkdir -p docs/build
          python3 tools/docs/build_html.py 2>&1 | tee docs/build/html.log

      - name: Validate every screenshot reference
        continue-on-error: true
        run: |
          mkdir -p docs/build
          python3 tools/docs/validate_guide.py 2>&1 | tee docs/build/validation.log

      - name: Render PDF
        id: render
        continue-on-error: true
        run: |
          node tools/docs/pdf.js 2>&1 | tee docs/build/pdf.log
          echo "pdf_exit=${PIPESTATUS[0]}" >> docs/build/pdf.log
          ls -la docs/*.pdf >> docs/build/pdf.log

      - name: Verify screenshots (paths, decoding, PDF embedding)
        if: always()
        run: |
          pip install --quiet pypdf || true
          python3 tools/docs/assert_images.py 2>&1 | tee docs/build/assert.log

      - name: Commit artefacts
        if: always()
        run: |
          git config user.name "docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          mkdir -p docs/build
          git add -A docs
          if git diff --cached --quiet; then echo "no changes"; ls -la docs/*.pdf || true; exit 0; fi
          git commit -q -m "docs: rebuild guide, catalogue and PDF [skip ci]"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:arena/ac321db7-dizihospital; then echo "pushed (attempt $i)"; break; fi
            echo "push attempt $i rejected - rebasing"; sleep 5
            git fetch -q origin arena/ac321db7-dizihospital
            git rebase -q -X theirs origin/arena/ac321db7-dizihospital || { git rebase --abort; git pull -q --no-rebase -X theirs origin arena/ac321db7-dizihospital; }
          done
          ls -la docs/*.pdf docs/*.md
