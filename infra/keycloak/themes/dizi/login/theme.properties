# DiziHospital sign-in theme — Bangla-first, over Keycloak's own login theme.
#
# A *messages-only* overlay on purpose: it inherits Keycloak's login templates, markup and JavaScript and overrides
# nothing but the words. A forked `login.ftl` is a file that has to be re-checked against every Keycloak upgrade, and
# the strings below cannot drift the same way.
#
# Why this exists at all: Keycloak ships 65 message bundles and Bangla is not one of them (checked against
# `themes/src/main/resources-community/theme/base/login/messages/` in the Keycloak repository). The staff desk is
# Bangla-first, and the sign-in page is served by Keycloak rather than by our app — so without this file, the first
# screen a receptionist sees would be the one screen in the product that is not in Bangla.
#
# Install: copy this directory into `$KC_HOME/themes/dizi/` (the compose file in `infra/` mounts it) and set the
# realm's login theme to `dizi`, which `realm-dizihospital.json` already does.
parent=keycloak.v2
locales=en,bn
