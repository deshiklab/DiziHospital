# DiziHospital — sign-in strings in Bangla.
#
# Every key in this file was checked against Keycloak's own `base/login/messages/messages_en.properties`: a key that
# does not exist there is a string that never renders, which is worse than an untranslated one, because the page then
# looks translated and is not. Anything not listed here falls back to the parent theme's English — the correct
# failure.
#
# The voice is the product's own: plain words a desk reads once. No jargon, and no "authentication" where "sign in"
# will do.
#
# See theme.properties in the directory above for why this exists: Keycloak ships 65 message bundles and Bangla is
# not one of them.

doLogIn=সাইন ইন করুন
